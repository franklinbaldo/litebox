[package]
name = "litebox_platform_linux_userland"
version = "0.1.0"
edition = "2024"

[dependencies]
arrayvec = { version = "0.7.6", default-features = false }
cfg-if = "1.0.0"
getrandom = "0.3.4"
libc = { version = "0.2.169", default-features = false }
litebox = { path = "../litebox/", version = "0.1.0" }
litebox_common_linux = { path = "../litebox_common_linux", version = "0.1.0" }
litebox_common_optee = { path = "../litebox_common_optee", version = "0.1.0", default-features = false, optional = true }
spin = "0.9.8"
syscalls = { version = "0.6", default-features = false }
zerocopy = { version = "0.8", default-features = false }
seccompiler = { version = "0.5.0" }

# AArch64 only. The SVC-frame layout that the rewriter's outbound stub builds is
# a rewriter/runtime ABI: `run_thread_arch` and `switch_to_guest` feed
# `AARCH64_SVC_FRAME_BYTES` / `AARCH64_SVC_FRAME_STUB_OFFSET` /
# `AARCH64_SVC_FRAME_X16_OFFSET` straight into `naked_asm!` as `const` operands,
# so the two sides cannot drift. The same dependency supplies the gate
# encodability bounds (`AARCH64_GUEST_TPIDR_OFFSET_ALIGN` /
# `AARCH64_MAX_GUEST_TPIDR_OFFSET`) that `guest_tpidr_tp_offset` checks the
# actual TLS layout against. Target-gated so no other target grows the edge, and
# `default-features = false` to keep the rewriter's binary-only `std`/`anyhow`/
# `clap` dependencies out of the graph.
[target.'cfg(target_arch = "aarch64")'.dependencies]
litebox_syscall_rewriter = { path = "../litebox_syscall_rewriter", version = "0.1.0", default-features = false }

[features]
default = ["linux_syscall"]
linux_syscall = []
optee_syscall = ["dep:litebox_common_optee"]

[lints]
workspace = true
