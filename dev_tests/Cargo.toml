[package]
name = "dev_tests"
version = "0.1.0"
edition = "2024"

# All dependencies here are dev dependencies, because this is just purely tests.
[dev-dependencies]
anyhow = "1.0.99"
fs-err = "3.1.2"
# `kvm_virtio_queue.rs` and `kvm_pci.rs` include guest modules that log; the
# guest crate has `log` as a dependency, and so must anything that hosts them.
log = { version = "0.4", default-features = false }

[lints]
workspace = true

[dependencies]
ignore = "0.4.25"

[features]
# Opt in to the QEMU boot test. It needs `qemu-system-x86_64` and the nightly
# toolchain pinned by `litebox_runner_optee_on_kvm/rust-toolchain.toml` (with `rust-src`),
# neither of which the default `Build and Test` CI job has, so the test target
# below is not built unless this is enabled. `--all-features` sweeps still
# compile and lint it.
kvm_qemu = []

[[test]]
name = "kvm_qemu_boot"
path = "tests/kvm_qemu_boot.rs"
required-features = ["kvm_qemu"]
