[package]
name = "litebox_runner_oci"
version = "0.1.0"
edition = "2024"
description = "OCI-compliant container runtime using LiteBox sandbox"

[dependencies]
# OCI spec parsing
oci-spec = { version = "0.9", features = ["runtime"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# LiteBox core
litebox = { version = "0.1.0", path = "../litebox" }
litebox_packager = { path = "../litebox_packager" }
litebox_runner_linux_userland = { path = "../litebox_runner_linux_userland" }

# Process exec (execv wrapper for child process)
exec = "0.3"

# Utilities
flate2 = "1.1"
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
