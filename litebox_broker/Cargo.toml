[package]
name = "litebox_broker"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
litebox_syscall_rewriter = { path = "../litebox_syscall_rewriter" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
