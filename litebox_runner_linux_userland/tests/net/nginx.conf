# nginx configuration for litebox integration test.
#
# Uses master/worker fork model — the master process binds+listens on
# the socket, then forks worker processes that inherit the listening fd
# and call accept().  Exercises litebox's fork snapshot+restore of
# listening TCP sockets.
master_process on;
daemon off;
worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr info;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    server {
        listen 10.0.0.2:8080;

        location / {
            return 200 'hello from litebox nginx\n';
            default_type text/plain;
        }
    }
}
