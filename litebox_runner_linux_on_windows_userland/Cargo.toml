[package]
name = "litebox_runner_linux_on_windows_userland"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.33", features = ["derive"] }
litebox = { version = "0.1.0", path = "../litebox" }
litebox_common_linux = { version = "0.1.0", path = "../litebox_common_linux" }
litebox_platform_windows_userland = { version = "0.1.0", path = "../litebox_platform_windows_userland" }
litebox_shim_linux = { version = "0.1.0", path = "../litebox_shim_linux", default-features = false }
litebox_util_log = { version = "0.1.0", path = "../litebox_util_log", features = ["backend_tracing"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
[lints]
workspace = true

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dev-dependencies]
litebox_desktop_host = { path = "../tools/litebox_desktop_host" }
litebox_desktop_transport = { path = "../tools/litebox_desktop_transport" }
windows-sys = { version = "0.60.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Media_Audio",
] }
