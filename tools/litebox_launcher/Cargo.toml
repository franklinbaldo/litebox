[package]
name = "litebox_launcher"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_Storage_EnhancedStorage", "Win32_System_Variant"] }
windows-sys = { version = "0.60.2", features = ["Win32_Storage_FileSystem", "Win32_System_Registry"] }

[profile.release]
debug = 0
incremental = false
lto = "thin"
strip = true

[profile.dev]
debug = 0
incremental = false
